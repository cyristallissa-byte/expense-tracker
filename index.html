<!DOCTYPE html>
<html>
<head>
  <title>Expense Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      max-width: 500px;
      margin: 30px auto;
      padding: 0 15px;
    }

    h1 {
      text-align: center;
      color: #2d3748;
    }

    .form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    input, select {
      padding: 10px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 16px;
      min-width: 0;
    }

    #amount { width: 90px; }
    #note { flex: 1; min-width: 120px; }

    button {
      padding: 10px 14px;
      background-color: #3182ce;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #2b6cb0;
    }

    .total-box {
      background-color: white;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
    }

    .total-box select {
      margin-bottom: 10px;
    }

    .chart-box {
      background-color: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      max-width: 300px;
      margin-left: auto;
      margin-right: auto;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background-color: white;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    li div {
      display: flex;
      gap: 6px;
    }

    li button {
      background-color: #e53e3e;
      padding: 6px 10px;
      font-size: 14px;
    }

    li button:hover {
      background-color: #c53030;
    }

    li button.edit {
      background-color: #718096;
    }

    li button.edit:hover {
      background-color: #4a5568;
    }
  </style>
</head>
<body>
  <h1>My Expense Tracker</h1>

  <div class="form">
    <input type="number" id="amount" placeholder="Amount">
    <input type="text" id="note" placeholder="What did you buy?">
    <select id="category">
      <option>Food</option>
      <option>Transport</option>
      <option>Shopping</option>
      <option>Other</option>
    </select>
    <input type="date" id="date">
    <button id="add-btn" onclick="addExpense()">Add</button>
  </div>

  <div class="total-box">
    <select id="month" onchange="changeMonth()"></select>
    <h2>Total: RM <span id="total">0.00</span></h2>
  </div>

  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>

  <div class="list-header">
    <h2>My Expenses</h2>
    <select id="filter" onchange="showExpenses()">
      <option>All</option>
      <option>Food</option>
      <option>Transport</option>
      <option>Shopping</option>
      <option>Other</option>
    </select>
  </div>
  <ul id="list"></ul>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
  <script>
    let expenses = JSON.parse(localStorage.getItem("expenses")) || [];
    let chart;
    let editingIndex = -1;
    let selectedMonth = "All";

    document.getElementById("date").value = new Date().toLocaleDateString("en-CA");

    function saveExpenses() {
      localStorage.setItem("expenses", JSON.stringify(expenses));
    }

    function inSelectedMonth(expense) {
      if (selectedMonth === "All") {
        return true;
      }
      return (expense.date || "").slice(0, 7) === selectedMonth;
    }

    function changeMonth() {
      selectedMonth = document.getElementById("month").value;
      showExpenses();
    }

    function updateMonthOptions() {
      let select = document.getElementById("month");
      let months = [];

      for (let i = 0; i < expenses.length; i++) {
        if (expenses[i].date) {
          let m = expenses[i].date.slice(0, 7);
          if (months.indexOf(m) === -1) {
            months.push(m);
          }
        }
      }

      months.sort().reverse();

      if (selectedMonth !== "All" && months.indexOf(selectedMonth) === -1) {
        selectedMonth = "All";
      }

      select.innerHTML = "";

      let allOption = document.createElement("option");
      allOption.value = "All";
      allOption.textContent = "All months";
      select.appendChild(allOption);

      for (let i = 0; i < months.length; i++) {
        let option = document.createElement("option");
        option.value = months[i];
        option.textContent = new Date(months[i] + "-15").toLocaleDateString("en-GB", { month: "long", year: "numeric" });
        select.appendChild(option);
      }

      select.value = selectedMonth;
    }

    function addExpense() {
      let amount = document.getElementById("amount").value;
      let note = document.getElementById("note").value;
      let category = document.getElementById("category").value;
      let date = document.getElementById("date").value;

      if (amount === "" || note === "" || date === "") {
        alert("Please fill in all the boxes!");
        return;
      }

      let expense = { note: note, amount: Number(amount), category: category, date: date };

      if (editingIndex === -1) {
        expenses.push(expense);
      } else {
        expenses[editingIndex] = expense;
        editingIndex = -1;
        document.getElementById("add-btn").textContent = "Add";
      }

      expenses.sort(function (a, b) {
        return (b.date || "").localeCompare(a.date || "");
      });

      saveExpenses();

      selectedMonth = date.slice(0, 7);

      document.getElementById("amount").value = "";
      document.getElementById("note").value = "";

      showExpenses();
    }

    function editExpense(index) {
      let e = expenses[index];
      document.getElementById("amount").value = e.amount;
      document.getElementById("note").value = e.note;
      document.getElementById("category").value = e.category || "Other";
      document.getElementById("date").value = e.date || new Date().toLocaleDateString("en-CA");

      editingIndex = index;
      document.getElementById("add-btn").textContent = "Save";
    }

    function deleteExpense(index) {
      expenses.splice(index, 1);
      saveExpenses();

      editingIndex = -1;
      document.getElementById("add-btn").textContent = "Add";
      document.getElementById("amount").value = "";
      document.getElementById("note").value = "";

      showExpenses();
    }

    function updateChart() {
      let categories = ["Food", "Transport", "Shopping", "Other"];
      let sums = [0, 0, 0, 0];

      for (let i = 0; i < expenses.length; i++) {
        if (!inSelectedMonth(expenses[i])) {
          continue;
        }

        let pos = categories.indexOf(expenses[i].category);
        if (pos !== -1) {
          sums[pos] = sums[pos] + expenses[i].amount;
        }
      }

      if (chart) {
        chart.destroy();
      }

      chart = new Chart(document.getElementById("chart"), {
        type: "doughnut",
        data: {
          labels: categories,
          datasets: [{
            data: sums,
            backgroundColor: ["#3182ce", "#38a169", "#ed8936", "#a0aec0"]
          }]
        }
      });
    }

    function showExpenses() {
      updateMonthOptions();

      let list = document.getElementById("list");
      let filter = document.getElementById("filter").value;
      list.innerHTML = "";
      let total = 0;

      for (let i = 0; i < expenses.length; i++) {
        if (!inSelectedMonth(expenses[i])) {
          continue;
        }

        total = total + expenses[i].amount;

        if (filter !== "All" && expenses[i].category !== filter) {
          continue;
        }

        let item = document.createElement("li");

        let text = document.createElement("span");
        text.textContent = (expenses[i].date || "no date") + " | " + expenses[i].note + " (" + expenses[i].category + ") - RM " + expenses[i].amount.toFixed(2);

        let buttons = document.createElement("div");

        let editBtn = document.createElement("button");
        editBtn.textContent = "Edit";
        editBtn.className = "edit";
        editBtn.onclick = function () { editExpense(i); };

        let deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";
        deleteBtn.onclick = function () { deleteExpense(i); };

        buttons.appendChild(editBtn);
        buttons.appendChild(deleteBtn);
        item.appendChild(text);
        item.appendChild(buttons);
        list.appendChild(item);
      }

      document.getElementById("total").textContent = total.toFixed(2);
      updateChart();
    }

    showExpenses();
  </script>
</body>
</html>
